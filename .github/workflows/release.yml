name: Release
# Para publicar: atualize a versão em package.json e o CHANGELOG.md, faça o commit e crie a tag (git tag v3.0.1 && git push --tags).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: A tag precisa ser a versão do package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test

  maddon:
    needs: check
    strategy:
      matrix:
        include:
          - { os: windows-latest, platform: win32-x64 }
          - { os: ubuntu-latest, platform: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build-release.mjs maddon --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: maddon-${{ matrix.platform }}
          path: dist/*.maddon

  publish:
    needs: maddon
    runs-on: ubuntu-latest
    # O Environment guarda UPDATE_SIGNING_KEY e exige a aprovação do dono antes de assinar e publicar.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: maddon-*
          merge-multiple: true
      - name: Zip de código, update.json e assinatura
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/build-release.mjs app
      - run: node scripts/build-release.mjs sums
      - name: Publicar (rascunho primeiro: o update.json só vai ao ar com todos os arquivos já enviados)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --latest --verify-tag --title "Sleuth ${GITHUB_REF_NAME#v}" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
